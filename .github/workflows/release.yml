name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          name="pdfslim_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          binary="pdfslim"
          if [ "${GOOS}" = "windows" ]; then binary="pdfslim.exe"; fi
          go build -trimpath -ldflags="-s -w" -o "dist/${name}/${binary}" ./cmd/pdfslim
          cp README.md THIRD_PARTY_NOTICES.md "dist/${name}/"
          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -qr "${name}.zip" "${name}")
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi

      - name: Upload job artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfslim-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: ignore

      - name: Upload Windows job artifact
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: pdfslim-${{ matrix.goos }}-${{ matrix.goarch }}-zip
          path: dist/*.zip

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
